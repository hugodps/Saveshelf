<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2B7871">
<meta name="color-scheme" content="light dark">
<title>Save Shelf</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#EEF2F0;--surface:#FFFFFF;--sunk:#E4EBE7;--ink:#16201D;--muted:#5B6863;--line:#CBD4D0;--accent:#2B7871;--accent-ink:#FFFFFF;--danger:#B3362B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1513;--surface:#17201C;--sunk:#1D2925;--ink:#E2E9E5;--muted:#91A099;--line:#29352F;--accent:#5DB3AA;--accent-ink:#0F1513;--danger:#E0796E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1513;--surface:#17201C;--sunk:#1D2925;--ink:#E2E9E5;--muted:#91A099;--line:#29352F;--accent:#5DB3AA;--accent-ink:#0F1513;--danger:#E0796E;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 56px;display:flex;flex-direction:column;gap:18px}
h1{font-size:28px;margin:0;letter-spacing:-.01em;line-height:1.1}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 4px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:12px}
.bar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--sunk);gap:2px;margin-bottom:12px}
.bar span{min-width:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;width:100%}
textarea{resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>input{flex:1 1 200px;width:auto}
.row>select{flex:0 1 160px;width:auto}
button.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer;display:inline-flex;align-items:center}
.ghost:disabled{opacity:.6;cursor:default}
.danger{color:var(--danger)!important}
.group{display:flex;flex-direction:column;gap:10px}
.group h2{display:flex;align-items:center;gap:8px}
.posts{display:flex;flex-direction:column;gap:10px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.post.hl{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.prow{display:flex;gap:12px;min-width:0}
.thumb{flex:none;width:88px;height:88px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--sunk);padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink);font:600 11px/1 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.pmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ptop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--muted)}
.ptop a{color:var(--accent);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ptop time{white-space:nowrap}
.ptitle{margin:0;font-weight:700;line-height:1.3;word-break:break-word}
.note{margin:0;word-break:break-word;font-size:14px}
.editform{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.pact{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pact select{width:auto;flex:1 1 130px;padding:7px 10px;font-size:13px}
.embed{display:flex;flex-direction:column;gap:6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1px solid var(--line);border-top:4px solid var(--c);background:var(--surface);color:var(--ink);border-radius:14px;padding:14px;font:inherit;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:96px}
.tile strong{font-size:17px}
.tl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.embed iframe{width:100%;height:540px;border:0;border-radius:10px;background:var(--sunk)}
.empty{color:var(--muted);text-align:center;padding:32px 12px;border:1px dashed var(--line);border-radius:14px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:14px 0}
.catbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:14px;font:inherit;text-align:left;cursor:pointer;display:flex;align-items:center;gap:8px}
.catbtn.sug{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.catbtn.sug::after{content:"Suggested";margin-left:auto;font-size:11px;color:var(--accent)}
.catbtn:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,label.ghost:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.link{word-break:break-all;color:var(--accent);font-size:13px;display:block;margin-top:6px}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px;font-size:13px;color:var(--muted)}
.savethumb{display:flex;gap:12px;align-items:center;margin-top:14px}
.savethumb img{width:72px;height:72px;object-fit:cover;object-position:top;border-radius:8px;border:1px solid var(--line);flex:none}
.col{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.attachimg{display:block;max-height:220px;max-width:100%;border-radius:10px;border:1px solid var(--line);margin-top:12px}
.attachlist{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.attachlist button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;text-align:left;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.attachlist button span:first-child{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.check{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px}
.check input{width:auto}
.catlist{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.catlist div{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
details summary{cursor:pointer;font-weight:600;list-style-position:inside}
details>*:not(summary){margin-top:12px}
.notice{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--accent) 14%,var(--surface));border:1px solid var(--accent);border-radius:12px;padding:10px 14px;font-size:14px}
.notice>span:first-child{flex:1 1 200px;min-width:0;word-break:break-word}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center;z-index:10}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const KEY='saveshelf.v1';
const SKEY='saveshelf.settings.v1';
const DEFAULT_CATS=['Workout','Mobility','Recipe','Travel','Inspiration'];
const UNC='Uncategorized';
const MODEL='claude-haiku-5-5';
const APP_VERSION='8 · 14 Oct 2026';
const IG=/https?:\/\/(?:www\.|m\.)?instagram\.com\/(?:[^\/\s?#]+\/)?(p|reel|reels|tv)\/([A-Za-z0-9_-]+)/i;
const ANYURL=/https?:\/\/[^\s]+/;

let db=load();
let settings=loadSettings();
let view='library', pending=null, attachImg=null, filter='All', query='', highlight=null, armed=null, thumbTarget=null, editing=null, notice=null;
const thumbs={};            // post id -> JPEG data URL (kept in IndexedDB)
const openEmbeds=new Set(); // post ids whose inline preview is open
const busy=new Set();       // post ids waiting for a suggestion
const app=document.getElementById('app');

/* ---------- storage ---------- */
function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&Array.isArray(d.posts)&&Array.isArray(d.cats))return d}catch(e){}
  return {cats:[...DEFAULT_CATS],posts:[]};
}
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Could not save on this device')}
}
function loadSettings(){
  try{return {apiKey:'',auto:true,readLink:true,stats:{ok:0,fail:0,last:''},...JSON.parse(localStorage.getItem(SKEY)||'{}')}}catch(e){return {apiKey:'',auto:true,readLink:true,stats:{ok:0,fail:0,last:''}}}
}
function persistSettings(){try{localStorage.setItem(SKEY,JSON.stringify(settings))}catch(e){toast('Could not save settings')}}

const idb=(()=>{
  let p;
  const open=()=>p||(p=new Promise((res,rej)=>{
    const r=indexedDB.open('saveshelf',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('thumbs');
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  }));
  return {
    async put(k,v){const d=await open();return new Promise((res,rej)=>{const t=d.transaction('thumbs','readwrite');t.objectStore('thumbs').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})},
    async del(k){const d=await open();return new Promise((res,rej)=>{const t=d.transaction('thumbs','readwrite');t.objectStore('thumbs').delete(k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})},
    async all(){const d=await open();return new Promise((res,rej)=>{const o={};const c=d.transaction('thumbs').objectStore('thumbs').openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){o[cur.key]=cur.value;cur.continue()}else res(o)};c.onerror=()=>rej(c.error)})}
  };
})();
function downscale(file,max=1000){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg',0.8));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('image'))};
    img.src=url;
  });
}
function keepThumb(id,dataUrl){
  thumbs[id]=dataUrl;
  idb.put(id,dataUrl).catch(()=>toast('Image kept for this visit only'));
}
async function takeSharedImage(){
  try{
    const c=await caches.open('saveshelf-share'),r=await c.match('shared-image');
    if(!r)return null;
    const blob=await r.blob();await c.delete('shared-image');return blob;
  }catch(e){return null}
}

/* ---------- helpers ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const colorFor=c=>{let h=0;for(const ch of c)h=(h*31+ch.charCodeAt(0))%360;return `hsl(${h} 45% 42%)`};
const catList=()=>[...db.cats,UNC];
const countBy=()=>{const m={};db.posts.forEach(p=>m[p.cat]=(m[p.cat]||0)+1);return m};
const fmtDate=iso=>{try{return new Date(iso).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}catch(e){return ''}};
const label=url=>{const m=url.match(/\/(p|reel|tv)\/([^/?#]+)/);if(m)return `${m[1]} · ${m[2]}`;try{return new URL(url).hostname}catch(e){return url}};
const kindOf=url=>{const m=url.match(/\/(p|reel|tv)\//);return m?(m[1]==='p'?'Post':m[1]==='reel'?'Reel':'Video'):'Link'};
const embedUrl=u=>{const m=u.match(/instagram\.com\/(p|reel|tv)\/([^/?#]+)/);return m?`https://www.instagram.com/${m[1]}/${m[2]}/embed/`:null};
const nameOf=p=>p.title||label(p.url);
const hasKey=()=>!!(settings.apiKey&&settings.apiKey.length>20);

function findUrl(...parts){
  for(const p of parts){const m=String(p||'').match(IG);if(m){const kind=m[1].toLowerCase()==='reels'?'reel':m[1].toLowerCase();return `https://www.instagram.com/${kind}/${m[2]}/`}}
  for(const p of parts){const m=String(p||'').match(ANYURL);if(m)return m[0]}
  return null;
}

let toastT;
function toast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2800);
}

function setView(v){
  view=v;
  if(v==='library'){try{history.replaceState(null,'',location.pathname)}catch(e){}}
  renderAll();
}
function renderAll(){view==='save'?renderSave():view==='attach'?renderAttach():renderLibrary()}

/* ---------- smart naming (optional, uses the viewer's own API key) ---------- */
function fail(code){const e=new Error(code);e.code=code;return e}
const errMsg=e=>({nokey:'Add your API key under Smart naming first',auth:'The API key was rejected. Check it under Smart naming',net:'Could not reach the API. Check your connection',http:'The API returned an error. Try again later',parse:'Could not read the suggestion. Try again',unreadable:'Instagram did not let the app read this post'}[e&&e.code]||'Could not get a suggestion');

async function suggestMeta(dataUrl){
  return askMeta([{type:'image',source:{type:'base64',media_type:'image/jpeg',data:dataUrl.split(',')[1]}}],'This is a screenshot of an Instagram post or reel');
}
async function suggestFromCaption(text){
  return askMeta([{type:'text',text:'Caption text:\n---\n'+text.slice(0,3000)+'\n---'}],'Below is the caption of an Instagram post or reel',true);
}
async function askMeta(parts,intro,textOnly){
  if(!hasKey())throw fail('nokey');
  const prompt=`${intro} that someone saved so they can find it again later. Reply with JSON only and no other text, in this shape: {"title":"...","description":"...","category":"..."}.
title: a clear name for the post, at most 8 words, in the language of the ${textOnly?'caption':'on-screen text'}.
description: one or two short sentences, at most 160 characters, saying what it shows or teaches, with any visible key details such as exercise names, ingredients or place names.
category: the best match from this list: ${catList().join(', ')}.
Use only what is ${textOnly?'in the caption':'visible'}. Do not guess names or facts.`;
  let res;
  try{
    res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'content-type':'application/json','x-api-key':settings.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:MODEL,max_tokens:300,messages:[{role:'user',content:[...parts,{type:'text',text:prompt}]}]})
    });
  }catch(e){throw fail('net')}
  if(res.status===401||res.status===403)throw fail('auth');
  if(!res.ok)throw fail('http');
  let j;try{j=await res.json()}catch(e){throw fail('parse')}
  const text=(j.content||[]).map(b=>b.text||'').join('');
  const m=text.match(/\{[\s\S]*\}/);if(!m)throw fail('parse');
  let o;try{o=JSON.parse(m[0])}catch(e){throw fail('parse')}
  return {
    title:String(o.title||'').trim().slice(0,80),
    description:String(o.description||'').trim().slice(0,200),
    category:catList().includes(o.category)?o.category:null
  };
}

// Experimental: asks Claude to fetch the post's public page and describe it.
// Instagram may refuse, so every failure is reported and nothing is lost.
async function readLink(url){
  if(!hasKey())throw fail('nokey');
  const m=url.match(/instagram\.com\/(p|reel|tv)\/([^/?#]+)/);
  const embed=m?`https://www.instagram.com/${m[1]}/${m[2]}/embed/captioned/`:url;
  const prompt=`Someone saved this Instagram post so they can find it again later. Fetch the page and describe it.
Page 1: ${embed}
Page 2: ${url}
Use only text that the fetched pages actually contain. If the pages show a login screen, an error, or no caption or description, reply exactly {"readable":false}. Do not guess from the web address.
Otherwise reply with JSON only: {"readable":true,"title":"...","description":"...","category":"..."}.
title: a clear name, at most 8 words, in the language of the caption.
description: one or two short sentences, at most 160 characters.
category: the best match from this list: ${catList().join(', ')}.`;
  const messages=[{role:'user',content:prompt}];
  let j=null;
  for(let i=0;i<3;i++){
    let res;
    try{
      res=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'content-type':'application/json','x-api-key':settings.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:MODEL,max_tokens:400,messages,tools:[{type:'web_fetch_20250910',name:'web_fetch',max_uses:2,max_content_tokens:4000,allowed_domains:['www.instagram.com']}]})
      });
    }catch(e){throw fail('net')}
    if(res.status===401)throw fail('auth');
    if(!res.ok){
      let msg='';try{msg=((await res.json()).error||{}).message||''}catch(e){}
      const e=fail('http');e.reason=`http ${res.status}${msg?': '+msg.slice(0,90):''}`;throw e;
    }
    try{j=await res.json()}catch(e){throw fail('parse')}
    if(j.stop_reason==='pause_turn'){messages.push({role:'assistant',content:j.content});continue}
    break;
  }
  let reason='';
  for(const b of (j&&j.content)||[]){
    if(b.type==='web_fetch_tool_result'&&b.content&&b.content.type==='web_fetch_tool_result_error')reason=b.content.error_code||'fetch error';
  }
  const texts=((j&&j.content)||[]).filter(b=>b.type==='text').map(b=>b.text||'').reverse();
  let o=null;
  for(const t of texts){const mm=t.match(/\{[\s\S]*\}/);if(mm){try{o=JSON.parse(mm[0]);break}catch(e){}}}
  if(!o||!o.readable||!(o.title||o.description)){const e=fail('unreadable');e.reason=reason||'no readable text';throw e}
  return {
    title:String(o.title||'').trim().slice(0,80),
    description:String(o.description||'').trim().slice(0,200),
    category:catList().includes(o.category)?o.category:null
  };
}

/* ---------- save screen (after a link is shared) ---------- */
function renderSave(){
  const u=pending.url;
  app.innerHTML=`
    <section class="card">
      <div class="eyebrow">Save to your shelf</div>
      <a class="link" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u)}</a>
      <p class="muted small" id="linkStatus" aria-live="polite" style="margin:6px 0 0"></p>
      <label class="field"><span>Title (optional)</span>
        <input id="title" maxlength="80" placeholder="e.g. 10-minute hip mobility routine" value="${esc(pending.title)}"></label>
      <label class="field"><span>Description (optional)</span>
        <input id="note" maxlength="200" placeholder="What is it about?" value="${esc(pending.note)}"></label>
      <label class="field"><span>Caption (paste it to name the post automatically)</span>
        <textarea id="caption" rows="3" maxlength="3000" placeholder="In Instagram, long-press the caption to copy it, then paste here">${esc(pending.caption||'')}</textarea></label>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
        <button type="button" class="ghost" id="pasteCap">Paste caption</button>
        <button type="button" class="ghost" id="capBtn"${hasKey()?'':' hidden'}>Name it from caption</button>
      </div>
      <div class="savethumb">
        <img id="savePrev" alt="Screenshot preview"${pending.thumb?` src="${pending.thumb}"`:' hidden'}>
        <div class="col">
          <label class="ghost">Add a screenshot<input type="file" id="saveThumb" accept="image/*" hidden></label>
          <button type="button" class="ghost" id="suggestBtn"${pending.thumb&&hasKey()?'':' hidden'}>Suggest title and description</button>
        </div>
      </div>
      <div class="eyebrow" style="margin-top:14px">Choose a category</div>
      <div class="cats">${catList().map(c=>`<button class="catbtn${pending.suggestCat===c?' sug':''}" data-pick="${esc(c)}"><span class="dot" style="background:${colorFor(c)}"></span>${esc(c)}</button>`).join('')}</div>
      <button class="ghost" id="cancel">Cancel</button>
    </section>`;
}

async function runReadLink(){
  if(!pending||!hasKey()||!settings.auto||!settings.readLink||!IG.test(pending.url))return;
  const status=()=>document.getElementById('linkStatus');
  const url=pending.url;
  if(status())status().textContent='Reading the post from its link…';
  try{
    const s=await readLink(url);
    settings.stats.ok++;settings.stats.last='worked';persistSettings();
    if(!pending||pending.url!==url)return;
    const t=document.getElementById('title'),n=document.getElementById('note');
    if(t&&!t.value.trim())t.value=s.title;
    if(n&&!n.value.trim())n.value=s.description;
    pending.suggestCat=s.category;
    document.querySelectorAll('.catbtn').forEach(b=>b.classList.toggle('sug',!!s.category&&b.dataset.pick===s.category));
    if(status())status().textContent='Filled in from the link. Check it before saving.';
  }catch(err){
    settings.stats.fail++;settings.stats.last=err.reason||err.code||'failed';persistSettings();
    if(!pending||pending.url!==url)return;
    if(status())status().textContent=err.code==='unreadable'
      ?'Instagram did not let the app read this post. Paste the caption below to name it, or save it and share a screenshot later for the picture.'
      :errMsg(err);
  }
}

async function runCaption(){
  const ta=document.getElementById('caption');if(!ta||!pending)return;
  const text=ta.value.trim();pending.caption=text;
  if(text.length<8){toast('Paste the caption first');return}
  if(!hasKey()){toast(errMsg(fail('nokey')));return}
  const btn=document.getElementById('capBtn');
  if(btn){btn.disabled=true;btn.textContent='Reading the caption…'}
  try{
    const s=await suggestFromCaption(text);
    const t=document.getElementById('title'),n=document.getElementById('note');
    if(t&&!t.value.trim())t.value=s.title;
    if(n&&!n.value.trim())n.value=s.description;
    if(pending)pending.suggestCat=s.category;
    document.querySelectorAll('.catbtn').forEach(b=>b.classList.toggle('sug',!!s.category&&b.dataset.pick===s.category));
    toast(s.category?`Named from the caption. Category: ${s.category}`:'Named from the caption');
  }catch(err){toast(errMsg(err))}
  const b2=document.getElementById('capBtn');
  if(b2){b2.disabled=false;b2.textContent='Name it from caption'}
}

async function runSuggestPending(){
  if(!pending||!pending.thumb||!hasKey())return;
  const btn=document.getElementById('suggestBtn');
  if(btn){btn.disabled=true;btn.textContent='Reading the screenshot…'}
  try{
    const s=await suggestMeta(pending.thumb);
    const t=document.getElementById('title'),n=document.getElementById('note');
    if(t&&!t.value.trim())t.value=s.title;
    if(n&&!n.value.trim())n.value=s.description;
    if(pending){pending.suggestCat=s.category;}
    document.querySelectorAll('.catbtn').forEach(b=>b.classList.toggle('sug',!!s.category&&b.dataset.pick===s.category));
    toast(s.category?`Suggested a name. Category: ${s.category}`:'Suggested a name');
  }catch(err){toast(errMsg(err))}
  const b2=document.getElementById('suggestBtn');
  if(b2){b2.disabled=false;b2.textContent='Suggest title and description'}
}

/* ---------- attach screen (after a screenshot is shared) ---------- */
function renderAttach(){
  const withoutImg=db.posts.filter(p=>!thumbs[p.id]);
  const list=(withoutImg.length?withoutImg:db.posts).slice(0,8);
  app.innerHTML=`
    <section class="card">
      <div class="eyebrow">Screenshot received</div>
      <img class="attachimg" src="${attachImg}" alt="Shared screenshot">
      ${db.posts.length?`
        <h2 style="margin-top:16px">Attach it to</h2>
        <div class="attachlist">${list.map((p,i)=>`<button data-attach="${esc(p.id)}"><span>${esc(nameOf(p))}</span><span class="muted small">${i===0?'Latest · ':''}${esc(p.cat)}</span></button>`).join('')}</div>
        ${hasKey()&&settings.auto?'<p class="muted small">The title and description will be filled in automatically if they are empty.</p>':''}`
      :`<p class="muted" style="margin:16px 0">There are no saved posts yet. Share an Instagram link to Save Shelf first, then share the screenshot.</p>`}
      <button class="ghost" id="cancel">Cancel</button>
    </section>`;
}

async function attachTo(id){
  const p=db.posts.find(x=>x.id===id);if(!p||!attachImg)return;
  const img=attachImg;
  keepThumb(id,img);
  if(hasKey()&&settings.auto&&(!p.title||!p.note)){
    toast('Reading the screenshot…');
    try{
      const s=await suggestMeta(img);
      if(!p.title)p.title=s.title;
      if(!p.note)p.note=s.description;
      toast('Image added and named');
    }catch(err){toast('Image added. '+errMsg(err))}
  }else toast('Image added');
  persist();attachImg=null;highlight=id;filter=(db.posts.find(x=>x.id===id)||{}).cat||'All';setView('library');
}

/* ---------- library ---------- */
function renderLibrary(){
  const cats=catList(),counts=countBy(),total=db.posts.length;
  const home=filter==='All';
  app.innerHTML=`
    <header>
      ${home?`<div class="eyebrow">${total} saved</div><h1>Save Shelf</h1>`
        :`<button class="ghost" data-filter="All" style="align-self:flex-start">‹ All categories</button><h1 style="display:flex;align-items:center;gap:10px"><span class="dot" style="background:${colorFor(filter)}"></span>${esc(filter)}</h1><div class="eyebrow">${counts[filter]||0} saved</div>`}
    </header>
    ${notice?`<div class="notice" role="status"><span>${esc(notice.text)}</span><span class="row">${notice.undo?'<button class="ghost" data-undo="1">Undo</button>':''}<button class="ghost" data-dismiss="1">OK</button></span></div>`:''}

    ${home?`<section class="card">
      <form id="addForm" class="row">
        <input id="addUrl" type="url" inputmode="url" placeholder="Paste an Instagram link" aria-label="Instagram link">
        <select id="addCat" aria-label="Category">${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select>
        <button class="primary" type="submit">Add</button>
      </form>
    </section>`:''}

    <input type="search" id="q" placeholder="${home?'Search all posts':'Search in '+esc(filter)}" value="${esc(query)}" aria-label="Search">

    <div id="list"></div>
    <input type="file" id="thumbFile" accept="image/*" hidden>

    ${home?`<details class="card">
      <summary>Smart naming (optional)</summary>
      <p class="muted small">Reads a screenshot and suggests a title, a short description and a category. It uses your own Anthropic API key, which stays in this browser only. Screenshots and links are sent to Anthropic when you use it. Create a key with a low spending limit at console.anthropic.com.</p>
      <form id="keyForm" class="row">
        <input id="apiKey" type="password" autocomplete="off" placeholder="${hasKey()?'Key saved. Paste a new one to replace it':'Paste your API key'}" aria-label="API key">
        <button class="ghost" type="submit">Save key</button>
      </form>
      ${hasKey()?`<div class="row" style="align-items:center"><span class="muted small">Key ending ${esc(settings.apiKey.slice(-4))}</span><button class="ghost danger" id="clearKey">Remove key</button></div>`:''}
      <label class="check"><input type="checkbox" id="autoSuggest"${settings.auto?' checked':''}> Suggest automatically when a screenshot is added</label>
      <label class="check"><input type="checkbox" id="readLinkChk"${settings.readLink?' checked':''}> Try to read shared links automatically (experimental)</label>
      <p class="muted small">Link reading so far: ${settings.stats.ok} worked, ${settings.stats.fail} failed${settings.stats.fail&&settings.stats.last&&settings.stats.last!=='worked'?`. Last problem: ${esc(settings.stats.last)}`:''}. Instagram often refuses automatic reading, so the screenshot method stays available.</p>
    </details>

    <details class="card">
      <summary>Manage categories</summary>
      <div class="catlist">${db.cats.map(c=>`<div><span><span class="dot" style="background:${colorFor(c)};display:inline-block;margin-right:8px"></span>${esc(c)} <span class="muted">${counts[c]||0}</span></span><button class="ghost danger" data-rmcat="${esc(c)}">Remove</button></div>`).join('')}
        <div><span class="muted">${UNC} (always available)</span></div></div>
      <form id="newCat" class="row">
        <input id="catName" maxlength="24" placeholder="New category name" aria-label="New category name">
        <button class="ghost" type="submit">Add category</button>
      </form>
    </details>

    <section class="card" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <span class="muted" style="flex:1 1 200px;font-size:13px">Your shelf and images are stored on this device. Export a backup to keep a copy.</span>
      <button class="ghost" id="exportBtn">Export backup</button>
      <button class="ghost" id="importBtn">Import backup</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </section>
    <p class="muted small" style="text-align:center;margin:0">Save Shelf version ${APP_VERSION}</p>`:''}`;
  renderList();
}

function postCard(p,cats){
  const img=thumbs[p.id],col=colorFor(p.cat),emb=embedUrl(p.url),open=openEmbeds.has(p.id),isEdit=editing===p.id;
  const body=isEdit?`
        <form class="editform" data-edit-form="${esc(p.id)}">
          <input name="title" maxlength="80" placeholder="Title" value="${esc(p.title||'')}" aria-label="Title">
          <input name="note" maxlength="200" placeholder="Description" value="${esc(p.note||'')}" aria-label="Description">
          <div class="pact"><button class="primary" type="submit">Save</button><button class="ghost" type="button" data-edit-cancel="1">Cancel</button></div>
        </form>`:`
        <div class="pmain">
          <div class="ptop"><a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${esc(label(p.url))}</a><time>${fmtDate(p.added)}</time></div>
          ${p.title?`<p class="ptitle">${esc(p.title)}</p>`:''}
          <p class="note${p.note?'':' muted'}">${esc(p.note||(p.title?'':'No title or description yet'))}</p>
        </div>`;
  return `
    <article class="post${highlight===p.id?' hl':''}">
      <div class="prow">
        ${body}
      </div>
      <div class="pact">
        <select data-move="${esc(p.id)}" aria-label="Move to category">${cats.map(c=>`<option${c===p.cat?' selected':''}>${esc(c)}</option>`).join('')}</select>
        <button class="ghost" data-edit="${esc(p.id)}">Edit</button>
                <button class="ghost danger" data-del="${esc(p.id)}">${armed===p.id?'Tap again to delete':'Delete'}</button>
      </div>
      ${emb?`<div class="embed"><iframe src="${esc(emb)}" loading="lazy" title="Instagram preview" allowtransparency="true"></iframe>
        <span class="muted small">Nothing showing? The post may be private, or your browser may block the preview. <a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">Open it on Instagram</a>.</span></div>`:''}
    </article>`;
}

function renderList(){
  const el=document.getElementById('list');if(!el)return;
  const cats=catList(),q=query.trim().toLowerCase();
  let list=db.posts.filter(p=>(filter==='All'||p.cat===filter)&&(!q||((p.title||'')+' '+(p.note||'')+' '+(p.caption||'')+' '+p.url+' '+p.cat).toLowerCase().includes(q)));
  if(!db.posts.length){el.innerHTML=`<div class="empty">Nothing saved yet.<br>Share an Instagram post to Save Shelf, or paste a link above.</div>`;return}
  if(!list.length){el.innerHTML=`<div class="empty">No posts match.</div>`;return}
  if(filter==='All'&&!q){
    const counts=countBy();
    el.innerHTML=`<div class="tiles">${cats.map(c=>{const last=db.posts.find(p=>p.cat===c&&p.title);return `
      <button class="tile" data-filter="${esc(c)}" style="--c:${colorFor(c)}">
        <span class="dot" style="background:${colorFor(c)}"></span>
        <strong>${esc(c)}</strong>
        <span class="muted">${counts[c]||0} saved</span>
        ${last?`<span class="muted small tl">${esc(last.title)}</span>`:''}
      </button>`}).join('')}</div>`;
  }else{
    el.innerHTML=`<div class="posts">${list.map(p=>postCard(p,cats)).join('')}</div>`;
  }
}

/* ---------- actions ---------- */
function commit(cat){
  const title=(document.getElementById('title')?.value||'').trim();
  const note=(document.getElementById('note')?.value||'').trim();
  const ex=db.posts.find(p=>p.url===pending.url);
  let id;
  if(ex){ex.cat=cat;if(title)ex.title=title;if(note)ex.note=note;if(pending.caption)ex.caption=pending.caption.slice(0,1500);id=ex.id;toast(`Moved to ${cat}`)}
  else{
    id=uid();db.posts.unshift({id,url:pending.url,cat,title,note,caption:(pending.caption||'').slice(0,1500),added:new Date().toISOString()});
    toast(hasKey()&&settings.auto&&!pending.thumb?`Saved to ${cat}. Share a screenshot of the post to add its picture and name.`:`Saved to ${cat}`);
  }
  if(pending.thumb)keepThumb(id,pending.thumb);
  highlight=id;persist();pending=null;filter=cat;setView('library');
}

function addLink(raw,cat){
  const url=findUrl(raw);
  if(!url){toast('That does not look like a link');return false}
  const ex=db.posts.find(p=>p.url===url);
  if(ex){ex.cat=cat;highlight=ex.id;toast(`Already saved, moved to ${cat}`)}
  else{const id=uid();db.posts.unshift({id,url,cat,title:'',note:'',added:new Date().toISOString()});highlight=id;toast(`Saved to ${cat}`)}
  persist();return true;
}

// Attaches a shared screenshot to a post, names it, and files it if it was left uncategorised.
async function autoAttach(post,img){
  const before={title:post.title||'',note:post.note||'',cat:post.cat,prevThumb:thumbs[post.id]||null};
  keepThumb(post.id,img);
  let text;
  try{
    const s=await suggestMeta(img);
    if(!post.title)post.title=s.title;
    if(!post.note)post.note=s.description;
    if(post.cat===UNC&&s.category)post.cat=s.category;
    text=`Added the picture and named it “${nameOf(post)}”`+(post.cat!==before.cat?`, filed under ${post.cat}`:'');
  }catch(err){text='Picture added. '+errMsg(err)}
  persist();highlight=post.id;filter=post.cat;
  notice={text,undo:()=>{
    post.title=before.title;post.note=before.note;post.cat=before.cat;
    if(before.prevThumb)keepThumb(post.id,before.prevThumb);
    else{delete thumbs[post.id];idb.del(post.id).catch(()=>{})}
    persist();
  }};
}

async function suggestForPost(id){
  const p=db.posts.find(x=>x.id===id),img=thumbs[id];
  if(!p||!img)return;
  busy.add(id);renderList();
  try{
    const s=await suggestMeta(img);
    if(!p.title)p.title=s.title;
    if(!p.note)p.note=s.description;
    persist();toast('Named from the image');
  }catch(err){toast(errMsg(err))}
  busy.delete(id);if(view==='library')renderAll();
}

async function init(){
  const q=new URLSearchParams(location.search);
  const title=q.get('title')||'';
  const found=findUrl(q.get('url'),q.get('text'),title);
  const thumbsReady=idb.all().then(o=>{Object.assign(thumbs,o)}).catch(()=>{});
  let shared=null;
  if(q.get('shared')==='image'){
    const blob=await takeSharedImage();
    if(blob){try{shared=await downscale(blob)}catch(e){toast('Could not read the shared image')}}
  }
  if(found){
    const note=(title||q.get('text')||'').replace(ANYURL,'').replace(/\s+/g,' ').trim().slice(0,140);
    pending={url:found,title:'',note,thumb:shared,suggestCat:null};view='save';
  }else if(shared){
    try{history.replaceState(null,'',location.pathname)}catch(e){}
    await thumbsReady;
    // A screenshot that arrives soon after a link was saved belongs to that post.
    const recent=db.posts.find(p=>!thumbs[p.id]&&Date.now()-Date.parse(p.added)<3600000);
    if(recent&&hasKey()&&settings.auto){
      app.innerHTML='<section class="card"><div class="eyebrow">Screenshot received</div><p>Reading the screenshot…</p></section>';
      await autoAttach(recent,shared);
      view='library';
    }else{attachImg=shared;view='attach'}
  }else if(q.toString()){
    toast('No link or image found in what you shared');
  }
  if(q.toString()){try{history.replaceState(null,'',location.pathname)}catch(e){}}
  renderAll();
  if(view==='save'&&pending.thumb&&hasKey()&&settings.auto)runSuggestPending();
  else if(view==='save'&&!pending.thumb)runReadLink();
  thumbsReady.then(()=>{if(view==='library')renderList();else if(view==='attach')renderAttach()});
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.pick){commit(t.dataset.pick);return}
  if(t.id==='cancel'){pending=null;attachImg=null;setView('library');return}
  if(t.id==='suggestBtn'){runSuggestPending();return}
  if(t.id==='capBtn'){runCaption();return}
  if(t.id==='pasteCap'){
    (async()=>{
      try{const x=await navigator.clipboard.readText();if(!x.trim()){toast('Clipboard is empty');return}
        document.getElementById('caption').value=x.slice(0,3000);
        if(hasKey()&&settings.auto)runCaption();else toast('Caption pasted')}
      catch(err){const ta=document.getElementById('caption');if(ta)ta.focus();toast('Long-press the box and choose Paste')}
    })();return}
  if(t.dataset.undo){if(notice&&notice.undo)notice.undo();notice=null;toast('Undone');renderAll();return}
  if(t.dataset.dismiss){notice=null;renderAll();return}
  if(t.dataset.attach){attachTo(t.dataset.attach);return}
  if(t.dataset.filter){filter=t.dataset.filter;renderAll();return}
  if(t.dataset.preview){
    const id=t.dataset.preview;
    openEmbeds.has(id)?openEmbeds.delete(id):openEmbeds.add(id);
    renderList();return;
  }
  if(t.dataset.addimg){thumbTarget=t.dataset.addimg;document.getElementById('thumbFile').click();return}
  if(t.dataset.edit){editing=t.dataset.edit;renderList();return}
  if(t.dataset.editCancel){editing=null;renderList();return}
  if(t.dataset.suggest){suggestForPost(t.dataset.suggest);return}
  if(t.dataset.del){
    const id=t.dataset.del;
    if(armed===id){
      db.posts=db.posts.filter(p=>p.id!==id);delete thumbs[id];openEmbeds.delete(id);idb.del(id).catch(()=>{});
      armed=null;persist();toast('Deleted');renderAll();
    }else{armed=id;renderList();setTimeout(()=>{if(armed===id){armed=null;renderList()}},4000)}
    return;
  }
  if(t.dataset.rmcat){
    const c=t.dataset.rmcat,n=countBy()[c]||0;
    if(n){toast(`Move the ${n} post(s) out of ${c} first`);return}
    db.cats=db.cats.filter(x=>x!==c);persist();renderAll();return;
  }
  if(t.id==='clearKey'){settings.apiKey='';persistSettings();toast('Key removed');renderAll();return}
  if(t.id==='exportBtn'){
    const blob=new Blob([JSON.stringify({...db,thumbs},null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='saveshelf-backup.json';document.body.appendChild(a);a.click();a.remove();
    return;
  }
  if(t.id==='importBtn'){document.getElementById('importFile').click();return}
});

document.addEventListener('submit',e=>{
  e.preventDefault();
  const f=e.target;
  if(f.id==='addForm'){
    const url=document.getElementById('addUrl').value,cat=document.getElementById('addCat').value;
    if(addLink(url,cat)){filter=cat;renderAll()}
  }
  if(f.id==='newCat'){
    const name=document.getElementById('catName').value.trim();
    if(!name){toast('Enter a name');return}
    if(name===UNC||db.cats.some(c=>c.toLowerCase()===name.toLowerCase())){toast('That category already exists');return}
    db.cats.push(name);persist();renderAll();
  }
  if(f.id==='keyForm'){
    const v=document.getElementById('apiKey').value.trim();
    if(!v){toast('Paste a key first');return}
    if(v.length<=20){toast('That does not look like an API key');return}
    settings.apiKey=v;persistSettings();toast('Key saved');renderAll();
  }
  if(f.dataset&&f.dataset.editForm){
    const p=db.posts.find(x=>x.id===f.dataset.editForm);
    if(p){const d=new FormData(f);p.title=String(d.get('title')||'').trim();p.note=String(d.get('note')||'').trim();persist();toast('Saved')}
    editing=null;renderList();
  }
});

document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.move){
    const p=db.posts.find(x=>x.id===el.dataset.move);
    if(p){p.cat=el.value;persist();toast(`Moved to ${p.cat}`);renderAll()}
    return;
  }
  if(el.id==='autoSuggest'){settings.auto=el.checked;persistSettings();return}
  if(el.id==='readLinkChk'){settings.readLink=el.checked;persistSettings();return}
  if(el.id==='thumbFile'){
    const f=el.files[0];el.value='';if(!f||!thumbTarget)return;
    try{keepThumb(thumbTarget,await downscale(f));toast('Image added');renderList()}
    catch(err){toast('Could not read that image')}
    return;
  }
  if(el.id==='saveThumb'){
    const f=el.files[0];el.value='';if(!f||!pending)return;
    try{
      pending.thumb=await downscale(f);
      const img=document.getElementById('savePrev');img.src=pending.thumb;img.hidden=false;
      const sb=document.getElementById('suggestBtn');if(sb&&hasKey())sb.hidden=false;
      if(hasKey()&&settings.auto)runSuggestPending();
    }catch(err){toast('Could not read that image')}
    return;
  }
  if(el.id==='importFile'){
    const f=el.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);if(!Array.isArray(d.posts))throw new Error('bad');
        let n=0;
        (d.cats||[]).forEach(c=>{if(c!==UNC&&!db.cats.includes(c))db.cats.push(c)});
        d.posts.forEach(p=>{
          if(p&&p.url&&!db.posts.some(x=>x.url===p.url)){
            const id=p.id||uid();
            db.posts.push({id,url:p.url,cat:p.cat||UNC,title:p.title||'',note:p.note||'',added:p.added||new Date().toISOString()});
            if(d.thumbs&&d.thumbs[p.id])keepThumb(id,d.thumbs[p.id]);
            n++;
          }
        });
        persist();toast(`Imported ${n} new post(s)`);renderAll();
      }catch(err){toast('That file is not a Save Shelf backup')}
    };
    r.readAsText(f);el.value='';
  }
});

document.addEventListener('paste',e=>{
  if(e.target.id==='caption'&&hasKey()&&settings.auto)setTimeout(runCaption,50);
});

document.addEventListener('input',e=>{
  if(e.target.id==='q'){query=e.target.value;renderList()}
  if(e.target.id==='caption'&&pending)pending.caption=e.target.value;
});

if('serviceWorker' in navigator){
  const hadController=!!navigator.serviceWorker.controller;
  let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    // A new version took over. Reload once, but only if nothing is being typed.
    if(!hadController||reloaded||view!=='library'||editing)return;
    reloaded=true;location.reload();
  });
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{}));
}
init();
</script>
